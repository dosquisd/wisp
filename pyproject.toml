[project]
name = "wisp"
version = "0.1.0"
description = "Wisp — ephemeral WireGuard VPNs on your own cloud"
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name="dosquisd", email="pereznjuandiego@gmail.com" },
  { name="SantiagoQP31", email="santiagoqp3103@gmail.com" },
]
dependencies = [
    "boto3>=1.43.83",
    "google-cloud-compute>=1.54.0",
    "oci>=2.100.0",
    "paramiko>=5.0.0",
    "platformdirs>=4.11.7",
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-aws>=7.0.0,<8.0.0",
    "pulumi-gcp>=9.37.0",
    "pulumi-oci>=4.22.0",
    "pulumi-tls>=5.5.1",
    "pywin32>=312 ; sys_platform == 'win32'",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
    "tqdm>=4.70.0",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/dosquisd/wisp"
Issues = "https://github.com/dosquisd/wisp/issues"

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
wisp = ["data/*.sh"]

# Use `uv tool install --editable .`
[project.scripts]
wisp = "wisp.main:main"

[tool.uv]
package = true

[tool.ruff]
exclude = [".git", ".pytest_cache", ".venv"]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
fixable = ["ALL"]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
