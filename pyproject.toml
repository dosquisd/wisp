[project]
name = "wisp"
version = "0.1.0"
description = "Wisp — ephemeral WireGuard VPNs on your own cloud"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ansible-core>=2.21.3",
    "boto3>=1.43.83",
    "jinja2>=3.1.6",
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-aws>=7.0.0,<8.0.0",
    "pulumi-tls>=5.5.1",
    "textual>=8.2.8",
    "tqdm>=4.70.0",
]

[tool.ruff]
exclude = [".git", ".pytest_cache", ".venv"]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
fixable = ["ALL"]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
